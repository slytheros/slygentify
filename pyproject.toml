[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "slygentify"
dynamic = ["version"]
description = "Make software repositories easier and safer for coding agents to understand and operate."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Slygentify contributors" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "packaging>=26.3,<27",
  "pathspec>=1.1.1,<2",
  "pydantic>=2.13,<3",
  "pyyaml>=6.0.3,<7",
  "rich>=15,<16",
  "textual>=8.2.8,<9",
  "typer>=0.16,<1",
]

[project.scripts]
slygentify = "slygentify.cli:app"

[project.urls]
Homepage = "https://github.com/slytheros/slygentify"
Source = "https://github.com/slytheros/slygentify"
Documentation = "https://github.com/slytheros/slygentify/tree/develop/docs"
Issues = "https://github.com/slytheros/slygentify/issues"
Changelog = "https://github.com/slytheros/slygentify/blob/develop/CHANGELOG.md"

[dependency-groups]
dev = [
  "doorstop>=3.2,<4",
  "hatchling>=1.27,<2",
  "jsonschema>=4.25,<5",
  "mypy>=1.17,<2",
  "pipx>=1.8,<2",
  "pre-commit>=4.3,<5",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "pypi-attestations>=0.0.30,<1",
  "ruff>=0.12,<1",
  "twine>=7,<8",
]

docs = [
  "mkdocs>=1.6.1,<2",
  "mkdocstrings-python>=2.0.5,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/slygentify"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/slygentify",
  "/pyproject.toml",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
]
exclude = [".gitignore", "/.gitignore"]

[tool.hatch.version]
path = "src/slygentify/_version.py"

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=slygentify",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=100",
]
testpaths = ["tests"]
markers = [
  "verifies(*test_specification_ids): links a test to one or more Doorstop TST items",
]

[tool.coverage.run]
source = ["slygentify"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = [
  "src",
  "tests",
  "tools/benchmark_scan_scaling.py",
  "tools/measure_acceptance.py",
  "tools/review_initialization.py",
  "tools/release.py",
  "tools/support",
]
