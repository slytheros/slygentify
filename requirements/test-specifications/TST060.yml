text: |
  Verify standalone and solution-associated C++ projects, classic sln and XML slnx
  membership with logical folders, conditional declarations, conflicts, unique locators,
  co-located projects and ecosystem facets, safe ownership and absence of self-relationships.
  Verify Make tooling without independent boundaries and configured/corroborated owners.
  Verify malformed and dynamic evidence, unsafe/missing references, XML DTD/entities,
  encoding, links, ignored/tracked evidence, sensitive-value withholding and bounded partial
  results. Verify deterministic canonical records, map/text/explorer/JSON parity, dependency
  attribution, initialization provenance and doctor drift while preserving human guidance.
  Verify that inspection does not evaluate configuration, execute recipes or contact networks.
