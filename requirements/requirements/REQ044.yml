text: |
  The optional [init] configuration shall independently bound generated AGENTS.md bytes
  and component entries with deterministic defaults of 4096 and 8. Each setting shall
  accept a positive integer or "unlimited"; max_agents_bytes below the documented fixed-
  router minimum shall be rejected. Initialization shall warn when either committed
  setting raises or disables its default, include configuration changes in provenance,
  preserve dry-run and lifecycle behavior, and enforce whichever bound remains active.
