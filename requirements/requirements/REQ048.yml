text: |
  Slygentify shall export immutable DoctorResult and DoctorDiagnostic values, stable
  DoctorInputError and DoctorOperationalError failures, doctor_repository, and named
  validation, canonical JSON, and packaged Draft 2020-12 schema interfaces. Readers
  shall apply bounded strict validation, reject duplicate keys, invalid UTF-8, BOMs,
  non-finite values, and oversized or cyclic inputs, while ignoring additive unknown
  same-major object properties. Producers shall revalidate closed values and emit only
  declared fields in fixed order as deterministic UTF-8, LF, two-space-indented JSON
  with one final newline and absent optional values omitted.
