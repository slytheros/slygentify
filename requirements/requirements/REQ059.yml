text: |
  Slygentify shall recognize valid vcxproj project boundaries and literal ProjectName,
  PlatformToolset, LanguageStandard and LanguageStandard_C declarations with unique XML
  locators, preserving conditional/deferred scope and conflicting source declarations
  without choosing effective settings. Property, metadata and item expressions shall
  remain unresolved and their values withheld. Conflict comparisons shall distinguish
  project properties, compiler defaults and individual compiler-item declarations;
  independent item metadata and defaults/overrides shall not produce false conflicts.
  Item selectors and their overlap shall not be evaluated.
  Classic sln and XML slnx solution membership shall
  establish workspace boundaries and safe relationships only for validated C++ projects.
  Exact paths shall take precedence; otherwise a unique case-insensitive match among
  safely catalogued project paths may resolve to a validated project. Reports shall
  retain the declared spelling and actual target spelling for such matches. Ambiguous,
  invalid, unreadable, excluded or unsafe targets shall remain unresolved. An incomplete
  resource-bounded lookup shall not establish a unique case-insensitive match.
  Logical solution folders shall not become filesystem boundaries. Co-located projects
  shall retain separate evidence within one stable path-based component and preserve
  other ecosystem facets; same-directory membership shall not create self-relationships.
  Makefile, makefile and GNUmakefile shall provide tooling evidence attached to an existing
  owner or retained at repository scope, without establishing boundaries or language facets.
  Imports, properties, conditions, variables, includes, computed targets and recipes shall
  remain unevaluated and unresolved. Malformed supported documents shall produce partial
  results while retaining independent valid evidence. DTD/entity expansion shall be
  prevented before parsing content; unsafe, sensitive and unavailable references shall not
  be followed or exposed. Inspection shall preserve containment, ignore, link, sensitive-file,
  memory and deadline guards and shall not execute discovered commands or access networks.
  Canonical records shall remain available across scan presentations and JSON, map,
  initialization provenance and doctor comparisons without public API or schema changes.
