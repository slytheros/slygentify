text: |
  `slygentify scan [PATH] --format text|json [--git-executable PATH]` shall use
  `scan_repository` as its scan operation, forward the optional executable path without
  adding a configuration or environment alias, and present the same result as plain text
  or the canonical JSON document.
  Default text shall identify the resolved root, completion within the currently
  supported inspection scope, supported ecosystems, and every component, relationship,
  finding, evidence record, diagnostic, and skipped scope in a component-first,
  deterministic hierarchy. Component content shall be organized as What it is, How to
  work on it, Architecture, Automation, and Attention & limitations; repository-wide workflows,
  primary component navigation and secondary auxiliary-component navigation shall remain
  distinct without omitting canonical component records,
  actionable attention, and routine inspection boundaries shall remain separately
  visible. Attention & limitations shall route diagnostics by explicit disposition into
  Problems & next steps, Limitations & explanations, and Notices; nest an unknown finding
  under a diagnostic when their subject and source evidence
  identify the same repository condition, present remaining unknowns as Unknowns to
  confirm, and route recommendations and explicitly reviewed caution finding codes
  without keyword inference. It shall show neutral item and canonical-record counts overall
  and disposition-specific nouns within diagnostic groups so
  grouping cannot imply data loss. Every evidence record shall appear
  in a final Sources & provenance appendix. Findings shall retain literal claim
  classifications and inspectable source citations. Repeated diagnostics and skipped
  scopes may be grouped for navigation but no canonical record may be omitted or merged.
  A compact claim-term guide shall explain classifications without adding another report
  branch. This comprehensive
  default is a scan-specific exception to the normally concise CLI default so that the
  non-interactive human report remains lossless after removal of `--verbose`.
  JSON shall remain the full
  canonical document; `--interactive` shall be a usage failure with JSON or without an
  interactive input and output terminal.
  Complete and honest partial results shall exit 0; operational failures shall write
  only an error to standard error and exit 1; Typer usage failures shall remain exit 2;
  JSON success shall write only the canonical document to standard output.
