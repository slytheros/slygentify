text: |
  Repository inspection shall enforce deterministic depth, entry, file-byte,
  aggregate-byte, open-file, and scanner-accounted-memory limits plus an elapsed-time
  limit across discovery, traversal, detection, normalization, and canonical result
  preparation, and shall identify result-affecting exhausted work as partial. Git tracked-path
  lookup shall use at most ten seconds or the remaining scan deadline, bound stdout by
  the remaining aggregate-byte and scanner-memory budgets, cap stderr at 64 KiB, and
  terminate and fall back to partial inspection when a bound is exhausted.
