text: |
  During initialization, Slygentify shall automatically upgrade supported legacy state
  and shall rebuild bounded readable invalid state when fresh whole-document bytes, an
  absent artifact, or exactly one well-formed visible managed-section boundary establishes
  safe ownership. Section recovery shall preserve every surrounding byte. Explicit adopt
  may append a section while rebuilding invalid state, and explicit replace may replace an
  ambiguous safe regular document. Newer schema majors, oversized or unreadable state, and
  unsafe entries shall fail without mutation and identify the required recovery action.
  Invalid state bytes shall never be reproduced or automatically backed up.
