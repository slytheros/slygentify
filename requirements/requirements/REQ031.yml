text: |
  Slygentify shall recognize bounded static CMake and ESP-IDF project markers and
  valid KiCad project documents as generic component evidence. Supported CMake
  declarations may add a first-class facet while retaining generic boundary evidence.
  KiCad schematic and board artifacts shall corroborate a sibling project boundary
  but shall not establish one alone. Unsupported evidence shall never claim installation, runtime
  use, command success, or first-class ecosystem support.
