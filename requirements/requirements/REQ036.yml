text: |
  Slygentify shall validate and serialize schema-major-1 provenance state as
  deterministic UTF-8 JSON containing only safe repository-relative metadata, hashes,
  derivations, artifacts, completion, and skipped scope records. Inputs shall retain
  digests for safely read evidence files, and every derivation and generated-artifact
  evidence relationship shall resolve to those captured inputs without retaining source
  content.
