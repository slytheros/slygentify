text: |
  Slygentify shall provide a deterministic, read-only doctor core that validates
  configuration and provenance, performs one fresh bounded scan when safe, compares
  managed guidance against current evidence, reports the approved static diagnostic
  contract with evidence and remediation, and preserves partial-result accounting. Each
  distinct fresh-scan partial cause shall produce one `doctor.inspection.partial`
  diagnostic with its exact safe location, omitted effect, source code or boundary
  reason, and condition-specific remediation; a diagnostic and skipped scope from the
  same event shall remain one cause, and resource-limit advice shall appear only for an
  actual named limit. Unmanaged guidance and harmless stale provenance shall be notices;
  statically unverifiable commands shall be limitations; other doctor findings shall be
  problems. Each partial wrapper shall preserve the originating scan disposition. The doctor core does
  not execute discovered repository commands, contact the network, or write repository
  files.
