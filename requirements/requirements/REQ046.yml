text: |
  User-visible diagnostics shall distinguish the observed problem from its effect on
  retained, omitted, withheld, or partial evidence. A diagnostic shall include recovery
  text only when a safe, concrete review or correction is available, shall not recommend
  weaker safety boundaries or unapproved effects, and shall compose the public message
  deterministically without changing the public diagnostic data model.
