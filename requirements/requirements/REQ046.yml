text: |
  Every Slygentify-authored result diagnostic, operational error, refusal, and warning
  shall identify a stable code and safe target, distinguish the observed problem from its
  effect on retained, omitted, withheld, refused, or partial work, and provide recovery
  only when it is safe and concrete. A diagnostic that refuses automatic repair shall
  state the ownership or safety rationale. Diagnostics shall not recommend weaker safety
  boundaries or unapproved effects, expose raw parser, Git, or operating-system exception
  text, or disclose secret-shaped content. Resolvable malformed, missing, unreadable,
  conflict, dynamic, unsupported, and resource-limit conditions shall name a
  condition-specific safe next step. Scan and map retain their compatible message while
  producers additionally expose optional structured category, problem, effect, recovery,
  and safety-rationale fields; doctor retains remediation and adds category and safety
  rationale. Private diagnostic candidates shall retain explicit structure and compose
  compatible public messages deterministically.
