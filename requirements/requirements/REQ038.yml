text: |
  Slygentify shall generate a concise deterministic root AGENTS.md as stable bootstrap
  guidance rather than a serialization of scan findings. It shall explain fresh map use,
  classification and evidence interpretation, separate-effect safety, and the read-only
  doctor-to-reviewed-regeneration maintenance loop; include a
  root-first breadth-first micro-index of primary components with one canonical evidence
  path each; summarize partial scans and omitted component counts without enumerating
  skipped paths; and exclude commands, CI bodies, runtime matrices, diagnostics,
  relationships, and general findings.
