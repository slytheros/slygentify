text: |
  Slygentify shall provide a reviewable initialization CLI dry-run, explicit replacement
  control, and actionable stdout, stderr, and exit-status behavior for successful, refused,
  and partially completed operations. Initialization diagnostics shall expose and render
  `notice` for relaxed limits, replacement-without-backup, and unmanaged or human-edited
  ownership boundaries, and `problem` for all other current conditions; disposition shall
  not change write, refusal, or exit behavior.
