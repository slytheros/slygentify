text: |
  Inspection shall apply hierarchical Gitignore rules, hard sensitive and VCS
  boundaries, narrow cache exclusions, and opaque nested repositories. Malformed
  Gitignore rules shall produce an explicit partial result with a diagnostic and
  skipped scope while inspection continues. Validated Git tracked paths shall
  override only the Gitignore layer: an exact tracked file may be retained and an ignored
  tracked-path prefix may be entered, while ignored untracked siblings and every harder
  boundary remain excluded. Unavailable tracked paths shall produce diagnostic
  `inspection.git-tracked-paths-unavailable`, repository-wide skipped reason
  `git_tracking_unavailable`, and an honest partial result.
