text: |
  Slygentify shall report attributable literal commands and Python runtime selections
  from approved Gitea, GitHub, and GitLab static workflow evidence. It shall retain exact
  locators for supported static scalar, object-axis, and include-matrix selections and
  use literal checkout paths and repository declarations to avoid attributing external
  workspaces to a Python component. Expression-only commands and ambiguous ownership
  shall remain unknown or unattributed. It shall resolve only bounded in-root GitLab local
  includes and never fetch or execute workflow content.
