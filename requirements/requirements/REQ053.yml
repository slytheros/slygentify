text: |
  For an unmanaged or human-edited safe regular root AGENTS.md without --replace,
  Slygentify init shall preserve the file, write deterministic paste-ready Slygentify
  guidance to standard output without an error diagnostic, and exit 4 to identify manual
  incorporation as required. The paste guidance shall not contain the generated document
  title or managed-artifact boilerplate. A dry-run shall retain its review output and exit
  4 for the same ownership states. For an unmanaged file without valid provenance,
  --adopt shall append and later manage only one visible marked section, rebuild any
  bounded readable invalid sidecar, and never reproduce surrounding human content during
  review.
