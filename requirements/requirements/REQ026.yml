text: |
  Slygentify shall report approved npm, pnpm, Yarn, Corepack, workspace, lock, Node,
  npm-engine, version-file, and static CI runtime declarations independently with
  provenance. It shall resolve only safe bounded in-root workspace patterns to valid
  package.json members, apply exclusions, and preserve missing, invalid, overlapping,
  and out-of-root evidence through actionable diagnostics. Competing manager families
  shall be retained without selecting a preference. A Node runtime conflict shall be
  reported only when an exact selection is demonstrably outside a supported range;
  unsupported comparisons shall remain unknown.
