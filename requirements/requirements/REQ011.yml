text: |
  Slygentify scan discovery shall locate the nearest containing Git repository using
  local metadata and shall not write files, execute discovered repository commands, or
  access network services. Before traversal, scan may invoke one selected Git executable
  with the fixed `ls-files --cached --full-name -z` capability accepted by ADR 0007.
  Automatic selection shall reject an executable inside the repository; an explicit
  executable path authorizes that exact executable, including a repository-contained
  executable whose arbitrary residual effects cannot be prevented by Slygentify.
