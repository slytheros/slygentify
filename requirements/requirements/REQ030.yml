text: |
  Slygentify shall retain one stable path-derived component identity per repository
  root while preserving every detected ecosystem facet. A component with multiple
  facets shall use the summary ecosystem `mixed`. Scan results shall expose
  a closed component role of `unknown` or inferred `auxiliary`, where auxiliary is based
  only on the approved exact path-segment conventions and retains the component's
  manifest evidence in an inferred finding. Scan results shall expose
  deterministic, evidence-backed containment and workspace-membership relationships
  without silently selecting among overlapping workspace parents.
