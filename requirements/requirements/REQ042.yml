text: |
  Slygentify shall expose immutable scan-projection-v1 values and named validation,
  projection, canonical JSON, and packaged JSON Schema interfaces. A projection shall
  identify its source scan and requested scope, select the deepest containing component,
  expose explicit root-to-parent ancestor, owner, and included direct-child component
  references for iterative one-hop navigation, provide top-level navigation when
  unmatched, preserve requested section order canonically, include complete record-plus-
  evidence units, report deterministic output-limit omissions, and never deserialize as
  a complete ScanResult. The default canonical
  JSON including its final newline shall not exceed 8 KiB; if required metadata and
  owning context cannot fit, projection shall fail with actionable guidance.
  Included diagnostics shall preserve disposition; schema-major-1 readers shall default an
  omitted disposition to `problem`, while current producers shall emit it.
