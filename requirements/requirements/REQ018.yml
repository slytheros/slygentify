text: |
  Slygentify shall validate untrusted scan objects and JSON through private strict
  adapters, expose a fresh packaged Draft 2020-12 schema for schema major 1, ignore
  unknown same-major object properties when reading, and reject duplicate keys,
  invalid UTF-8 or BOM input, non-finite numbers, and inputs exceeding the documented
  size, nesting, string, collection, or object-graph limits. Serialization shall
  revalidate a closed producer object and emit deterministic canonical UTF-8 JSON with
  declared fields only, fixed field and collection order, omitted absent optional
  values, LF line endings, two-space indentation, and one final newline. Additive
  schema-major-1 component fields shall remain optional for readers and apply their
  documented defaults when absent.
