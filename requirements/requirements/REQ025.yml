text: |
  Slygentify shall identify JavaScript and TypeScript package components only from valid,
  safely read package.json objects and shall retain exact JSON Pointer evidence locations
  for approved metadata, direct dependencies, scripts, and executable entries. Private,
  unnamed, and unversioned packages shall remain valid boundaries. Script text that
  resembles literal credential material shall be withheld without asserting that it is a
  confirmed secret, and unsafe or unsupported bin targets shall be withheld. Slygentify
  shall not install dependencies, resolve dependency graphs, execute scripts, or infer
  runtime use from package declarations.
