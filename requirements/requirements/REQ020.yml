text: |
  Slygentify shall identify Python components only from approved static manifest
  declarations, retain exact evidence locations for supported metadata and direct
  dependencies, encode dynamic TOML keys as unambiguous valid dotted-key segments,
  accept whitespace-delimited inline comments in requirements files,
  distinguish direct requirements from constraints and recognizable generated lock
  output, and shall never evaluate setup.py, unrendered template manifests, or dynamic
  metadata. When an approved generic
  ecosystem manifest declares the same component path, Slygentify shall retain the
  Python evidence without promoting the polyglot component to Python or attributing
  root CI commands to Python.
