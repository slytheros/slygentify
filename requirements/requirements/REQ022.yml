text: |
  Slygentify shall report the approved Python test, quality, typing, migration, and
  framework evidence only from supported static configuration or direct dependency
  declarations and shall not claim installation, activation, or runtime use. Supported
  tox INI configuration shall be retained, and multiple tool locations shall be reported
  as a conflict only when they occur at the same supported component root.
