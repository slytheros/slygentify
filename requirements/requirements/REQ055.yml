text: |
  Generated provenance state shall omit skipped-scope observations caused by checked-out
  Gitignore rules or built-in convenience exclusions while retaining every other skipped
  scope. Scan, map, and doctor results shall continue to expose the complete fresh
  skipped-scope accounting. Existing supported sidecars containing the omitted records
  shall remain valid, may produce the existing informational stale-state notice until
  explicit initialization regenerates them, and shall require no schema migration.
