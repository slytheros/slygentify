text: |
  For post-1.0 releases, Slygentify shall provide a versioned repository-owned checklist
  command that validates immutable release inputs, executes only ordered selected checks,
  writes canonical path-sanitized evidence outside the repository and selected corpora,
  and fails closed on stale, inconsistent, incomplete, or non-reproducible state. The
  command shall present dry-run effects and bounded human review packets, but shall not
  merge pull requests, create or move tags, approve environments, publish packages, create
  GitHub releases, or record a human decision on the maintainer's behalf.
