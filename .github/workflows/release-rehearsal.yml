name: Rehearse release helper

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/release*.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tools/release.py'
      - 'tools/release_checklist.py'

permissions:
  contents: read

jobs:
  release-helper:
    name: Import locked release helpers on a clean runner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.32
          python-version: '3.14'
          enable-cache: true

      - name: Install locked release tooling
        run: uv sync --locked --all-groups

      - name: Exercise the release helper import path
        run: |
          set -euo pipefail
          uv run --locked --no-sync python -m tools.release version v1.2.3
          uv run --locked --no-sync python -m tools.release_checklist --help
